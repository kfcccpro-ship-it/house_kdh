name: Web Push Alarms

# 5분마다 실행 (GitHub 사정으로 몇 분~수십 분 늦어질 수 있음)
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: push
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
        working-directory: push
      - run: node send.mjs
        working-directory: push
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
